user root;
pid /tmp/nginx.pid;
error_log /tmp/error.log;
events {}
http {
  access_log off;
  default_type text/plain;
  server {
    listen 80;
    location = /ok { return 200 alive; }
  }
  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/test.crt;
    ssl_certificate_key /etc/nginx/certs/test.key;
    location / { add_header X-Proto $scheme always; return 200 "tls root\n"; }
  }
}
