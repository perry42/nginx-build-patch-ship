# Container-ready (listen 80) config for rewrite parity tests.
user root;
pid /tmp/nginx.pid;
error_log /tmp/error.log;
events {}
http {
  access_log off;
  server {
    listen 80;
    # PoC location for CVE-2026-42945 (rewrite with '?' in replacement + captures)
    location /a/ {
      rewrite ^(.*) /new?c=1;
      set $myvar $1;
      return 200 "myvar=[$myvar]\n";
    }
    location /last/ { rewrite ^/last/(.*)$ /dest/$1 last; }
    location /brk/  { rewrite ^/brk/(.*)$ /dest/$1 break; return 200 "brk=$uri args=[$args]\n"; }
    location /dest/ { return 200 "dest uri=$uri args=[$args]\n"; }
    location /redir/ { rewrite ^/redir/(.*)$ /target/$1 redirect; }
    location /perm/  { rewrite ^/perm/(.*)$ /target/$1 permanent; }
    location /setret/ { rewrite ^/setret/(.*)$ /x break; set $v $1; return 200 "v=[$v]\n"; }
    location /ifre/ {
      if ($uri ~ "^/ifre/(.+)$") { set $cap $1; }
      return 200 "cap=[$cap]\n";
    }
    location /lit/ { rewrite ^/lit/(.*)$ /dest/lit?fixed=1 last; }
    location /trail/ { rewrite ^/trail/(.*)$ /dest/$1? last; }
    location /ok { return 200 alive; }
    location / { return 200 root; }
  }
}
