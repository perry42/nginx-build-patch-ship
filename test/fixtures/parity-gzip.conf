# gzip / gzip_static parity: zlib1g is the one library replaced in the patched image.
user root;
pid /tmp/nginx.pid;
error_log /tmp/error.log;
events {}
http {
  access_log off;
  default_type text/plain;
  gzip on;
  gzip_types text/plain;
  gzip_min_length 1;
  server {
    listen 80;
    server_name _;
    root /srv/gz;
    location = /ok { return 200 alive; }
    location = /static.txt { gzip off; gzip_static on; }
    location / { }
  }
}
