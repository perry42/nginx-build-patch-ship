# Parity config: body limits, custom headers, server_tokens off, return/location mix.
user root;
pid /tmp/nginx.pid;
error_log /tmp/error.log;
events {}
http {
  access_log off;
  default_type text/plain;
  client_max_body_size 8m;
  server {
    listen 80;
    server_name _;
    location = /ok { return 200 alive; }
    location /upload { return 200 "len=$content_length\n"; }
    location /small { client_max_body_size 1k; return 200 "small-ok\n"; }
    location / { return 200 "root\n"; }
  }
  # Custom behaviour: tokens off, add_header, return/location mix, second vhost.
  server {
    listen 8081;
    server_name custom.test;
    server_tokens off;
    add_header X-Echo-Test "custom" always;
    add_header X-Frame-Options DENY always;
    location = /ok { return 200 alive; }
    location = /exact { add_header X-Loc exact always; return 200 "exact\n"; }
    location /prefix/ { add_header X-Loc prefix always; return 200 "prefix $uri\n"; }
    location ~ \.php$ { return 403 "no php\n"; }
    location /moved { return 301 /exact; }
    location /gone { return 410; }
    location / { return 404 "custom 404\n"; }
  }
}
