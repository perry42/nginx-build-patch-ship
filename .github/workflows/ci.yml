# Build the .deb and the image from source, then run the parity tests.
# STATUS: written but not yet run on GitHub. I tested the same commands locally
# (`make all`), not this workflow file.
# The scans (`make scan vex diff`) take about 12 minutes and are left out of the
# per-push run; the weekly job below runs everything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Mondays, full run with scans
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the image (this builds the .deb from source first)
        run: make image
      - name: Install test requirements
        run: make deps
      - name: Parity tests (original vs ours)
        run: make test
      - name: Verify the fixes (real run must pass, control run must fail)
        run: make verify

  full-with-scans:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Everything, from scratch
        run: make all BUILD_FLAGS=--no-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-reports
          path: |
            scans/rescan/
            reports/*.generated.txt
